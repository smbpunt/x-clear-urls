<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>X-Clear-URLs</title>
    <meta name="manifest.type" content="browser_action" />
  </head>
  <body>
    <header class="header">
      <h1 class="title">X-Clear-URLs</h1>
      <div class="counter">
        <span class="counter-value" id="count">0</span>
        <span class="counter-label" id="count-label">links cleaned</span>
      </div>
    </header>

    <section class="history">
      <div class="history-head">
        <h2>History</h2>
        <button type="button" class="link-button" id="clear" hidden>Clear</button>
      </div>
      <ol class="entries" id="entries"></ol>
      <p class="empty" id="empty" hidden>
        No links cleaned yet.<br />
        Copy a link on <span id="site-list"></span> to get started.
      </p>
    </section>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
